name: MCP server

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
- uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: MCP server smoke tests
        env:
          MCP_TEST_RUNNER: ''
        run: python3 -m unittest discover -s tests -p "test_mcp_server.py" -v
