# Adaptive Cyber-Immunity Dependabot Policy — generated by karun99 security engineering
#
#   Adapt  : continuous weekly refresh of the dependency surface
#   Detect : scheduled scans across every ecosystem present in this repository
#   Analyse: grouped, typed updates so related dependencies move together
#   Validate: every change is a distinct, reviewable PR (no silent auto-merge)
#   Respond : reviewers/assignees + labels route each PR to the right owner
#   Record : prefixed commit messages + labels create a searchable audit trail
#   Govern  : explicit allow/ignore policy + approval gates = least-privilege change
#
# Security updates (known vulnerable versions) are raised IMMEDIATELY by GitHub,
# independent of the weekly schedule and outside these limits.
#
# Cognitive Robotics / Neuromorphic Security Context:
# - Organoid/MEA and BPU-backed control loops are validated in CI (see workflows).
# - Adversarial testing of neural security layers is enforced by the security.yml gate.
# - Coherence metrics gate merges; Dependabot keeps the dependency surface clean.
#
version: 2

updates:


  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    target-branch: main
    reviewers:
      - karun99
    assignees:
      - karun99
    labels:
      - dependencies
      - security
      - automated
    commit-message:
      prefix: "deps"
      include: scope
    versioning-strategy: increase-if-necessary
    groups:
      # Adaptive security: batch updates into grouped PRs to keep CI green & auditable
      Dependabot-adaptive-security-<USER>:
        update-types:
          - "major"
          - "minor"
          - "patch"
